<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101018">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Crystal</title>
<style>
  html, body { margin: 0; height: 100%; background: #101018; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; }
  /* Bevy fits the canvas to #wrap, so #wrap always has a size of its own */
  #wrap { width: min(100vw, calc((100vh - 26px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; }
  #screen { display: block; outline: none; }
  #help { color: #667; font: 12px ui-monospace, monospace; margin-top: 8px; text-align: center; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #c8cce0; font: 600 15px system-ui; pointer-events: none; }
  #pad { display: none; }
  body.touch #help { display: none; }
  body.touch #wrap { position: fixed; }
  body.touch #pad { display: block; position: fixed; inset: 0; pointer-events: none; }
  .btn { position: absolute; pointer-events: auto; display: flex; align-items: center; justify-content: center;
    font: 800 16px -apple-system, system-ui, sans-serif; color: rgba(255,255,255,0.92); touch-action: none;
    background: linear-gradient(180deg, #3a3f55, #262a3a); border: 1px solid rgba(255,255,255,0.10); border-radius: 50%;
    box-shadow: 0 4px 0 #14161f, 0 6px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.18);
    transition: transform 60ms, box-shadow 60ms; text-shadow: 0 1px 1px rgba(0,0,0,0.5); }
  .btn.on { transform: translateY(3px); box-shadow: 0 1px 0 #14161f, 0 2px 6px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12); }
  .ab { width: 68px; height: 68px; font-size: 22px; }
  #bA { background: radial-gradient(circle at 35% 30%, #ff8a78, #e0463a 55%, #a82a24); box-shadow: 0 4px 0 #6e1a16, 0 6px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.35); }
  #bB { background: radial-gradient(circle at 35% 30%, #8ab4ff, #4a7ae0 55%, #2c4fa8); box-shadow: 0 4px 0 #1a2f6e, 0 6px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.35); }
  #bA.on, #bB.on { transform: translateY(3px); filter: brightness(1.12); }
  .pill { width: 74px; height: 26px; border-radius: 13px; font-size: 10px; letter-spacing: 1.5px; font-weight: 700; }
  #dpad { position: absolute; width: 150px; height: 150px; pointer-events: auto; touch-action: none; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.5)); }
  #dpad .arm { position: absolute; background: linear-gradient(180deg, #3a3f55, #23263a); border: 1px solid rgba(255,255,255,0.10); box-shadow: inset 0 1px 0 rgba(255,255,255,0.14); }
  #dpad .h { left: 0; top: 50px; width: 148px; height: 48px; border-radius: 12px; }
  #dpad .v { top: 0; left: 50px; width: 48px; height: 148px; border-radius: 12px; }
  #dpad .hub { position: absolute; left: 57px; top: 57px; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #2a2e40, #171a26); }
  #dpad .arrow { position: absolute; width: 0; height: 0; border: 7px solid transparent; opacity: 0.55; }
  #dpad .au { left: 67px; top: 10px; border-bottom: 10px solid #fff; border-top: 0; }
  #dpad .ad { left: 67px; bottom: 10px; border-top: 10px solid #fff; border-bottom: 0; }
  #dpad .al { top: 67px; left: 10px; border-right: 10px solid #fff; border-left: 0; }
  #dpad .ar { top: 67px; right: 10px; border-left: 10px solid #fff; border-right: 0; }
  #dpad .lit { position: absolute; width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.22); display: none; }
  /* the notch and the home bar, measured for the layout */
  #safe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen"></canvas></div>
<div id="help">Arrows/WASD move · Z/Space = A · X/Backspace = B · Enter = Start · Shift = Select · F = fast-forward</div>
<div id="loading">Loading...</div>
<div id="pad">
  <div id="dpad"><div class="arm h"></div><div class="arm v"></div><div class="hub"></div><div class="lit" id="lit"></div><div class="arrow au"></div><div class="arrow ad"></div><div class="arrow al"></div><div class="arrow ar"></div></div>
  <div class="btn ab" id="bA">A</div>
  <div class="btn ab" id="bB">B</div>
  <div class="btn pill" id="bSel">SELECT</div>
  <div class="btn pill" id="bSt">START</div>
  <div class="btn pill" id="bFF" style="width:46px">»</div>
</div>
<div id="safe"></div>
<script type="module" src="host.js"></script>
</body>
</html>
