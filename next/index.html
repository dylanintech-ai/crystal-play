<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101018">
<title>Pokémon Tempora</title>
<style>
  html, body { margin: 0; height: 100%; background: #101018; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #screen { display: block; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #000; outline: none; }
  #wrap { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  body.touch #wrap { width: 100vw; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #c8cce0; font: 600 15px system-ui; pointer-events: none; }
  #pad { display: none; width: 100%; max-width: 640px; height: 210px; position: relative; }
  body.touch #pad { display: block; }
  body.touch #screen { width: 100vw; }
  .btn { position: absolute; border-radius: 50%; background: #2a2c3c; border: 2px solid #4a4e66; color: #c8cce0; font: bold 16px system-ui; display: flex; align-items: center; justify-content: center; }
  .btn.on { background: #4a4e66; }
  .dpad { width: 54px; height: 54px; border-radius: 10px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen"></canvas></div>
<div id="loading">Loading...</div>
<div id="pad">
  <div class="btn dpad" data-k="0" style="left:66px;top:18px">▲</div>
  <div class="btn dpad" data-k="1" style="left:66px;top:126px">▼</div>
  <div class="btn dpad" data-k="2" style="left:12px;top:72px">◀</div>
  <div class="btn dpad" data-k="3" style="left:120px;top:72px">▶</div>
  <div class="btn" data-k="4" style="right:20px;top:46px;width:66px;height:66px">A</div>
  <div class="btn" data-k="5" style="right:100px;top:96px;width:60px;height:60px">B</div>
  <div class="btn" data-k="7" style="left:calc(50% - 68px);top:170px;width:60px;height:26px;border-radius:13px;font-size:11px">SELECT</div>
  <div class="btn" data-k="6" style="left:calc(50% + 8px);top:170px;width:60px;height:26px;border-radius:13px;font-size:11px">START</div>
</div>
<script type="module" src="host.js"></script>
</body>
</html>
